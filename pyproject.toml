[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qcross-backend"
version = "0.1.0"
description = "Instrument discovery and storage for future QCross portfolio tools"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "uvicorn>=0.30,<1",
  "pyarrow>=21,<24",
  "numpy>=2.3,<3", "pandas>=2.3,<4", "scipy>=1.16,<2",
  "scikit-learn>=1.7,<2", "cvxpy>=1.7,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "nonlinshrink==0.7", "matplotlib>=3.10,<4"]

[project.scripts]
qcross = "app.cli.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network'"
markers = ["network: opt-in live source integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
